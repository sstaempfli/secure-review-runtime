name: 'Secure Review Runtime'
description: 'Runtime HTTP security probes: attack / attack-ai against a live URL, optional ZAP & Nuclei, authenticated probes via headers or browser-login script.'
branding:
  icon: 'shield'
  color: 'orange'
inputs:
  config:
    description: 'Path to .secure-review.yml'
    required: false
    default: '.secure-review.yml'
  mode:
    description: 'attack | attack-ai | review. Default is the deterministic `attack` mode (no LLM, no API keys, runs on every PR). Set to `attack-ai` for LLM-planned probing — requires a provider API key in the env. `review` is mapped to a static-only warning in the runner.'
    required: false
    default: 'attack'
  runtime-mode:
    description: 'Optional explicit selector — attack | attack-ai | review'
    required: false
    default: ''
  target-url:
    description: 'Live application base URL (required for attack / attack-ai).'
    required: false
    default: ''
  pentest-scanners:
    description: 'Optional comma-separated zap-baseline,nuclei'
    required: false
    default: ''
  browser-login-script:
    description: 'Node script printing JSON headers line for authenticated scans'
    required: false
    default: ''
  auth-headers-json:
    description: 'JSON object of extra HTTP headers'
    required: false
    default: ''
  runtime-timeout-seconds:
    description: 'Wall-clock budget for probes and scanners (30–7200)'
    required: false
    default: '900'
  max-cost-usd:
    description: 'Cost cap for attack-ai (USD). Acts as a post-planning circuit breaker: if the LLM-planning call exceeded this, the run aborts before probing. Set to 0 to disable. Ignored by the deterministic `attack` mode (which never calls an LLM).'
    required: false
    default: '20'
  enable-runtime-attacks:
    description: 'Opt in to live runtime probing on every PR. Without this (or `dynamic.enabled: true` in your config), `attack` / `attack-ai` modes are skipped with a warning. This guards against a stale `dynamic.target_url` silently firing probes at a third-party host.'
    required: false
    default: 'false'
runs:
  using: 'node20'
  main: 'dist-action/index.js'
